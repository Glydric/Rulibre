[workspace]
resolver = "2"
members = [
    "crates/rulibre",
    "crates/rulibre-core",
    "crates/rulibre-gui",
]
default-members = ["crates/rulibre-core", "crates/rulibre"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Glydric/Rulibre"
homepage = "https://github.com/Glydric/Rulibre"
authors = ["Leonardo Migliorelli"]
description = "A lightweight replacement for Calibre — browse your library and transfer books to your e-reader."
keywords = ["calibre", "ebook", "kindle", "kobo", "ereader"]
categories = ["command-line-utilities"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"
roxmltree = "0.21"
