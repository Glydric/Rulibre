[package]
name = "rulibre"
version = "0.1.2"
edition = "2024"
default-run = "rulibre"
description = "A lightweight TUI replacement for Calibre's interface — browse your library and transfer books to your e-reader"
license = "MIT"
repository = "https://github.com/Glydric/Rulibre"
homepage = "https://github.com/Glydric/Rulibre"
authors = ["Leonardo Migliorelli"]
keywords = ["calibre", "ebook", "tui", "kindle", "kobo"]
categories = ["command-line-utilities"]
exclude = ["assets/"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"
roxmltree = "0.21"
